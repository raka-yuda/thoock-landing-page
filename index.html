<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/thoock-icon.svg" />
    <link rel="preload" href="/fonts/geist-latin-variable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" as="image" href="/screenshots/review-queue.webp" imagesrcset="/screenshots/review-queue-480.webp 480w, /screenshots/review-queue-800.webp 800w, /screenshots/review-queue.webp 1500w" imagesizes="(max-width: 767px) calc(100vw - 40px), (max-width: 1100px) calc(100vw - 150px), 1090px" fetchpriority="high" />
    <meta name="theme-color" content="#f4f8f5" />
    <meta name="description" content="Research ideas, write commercial briefs, generate and review images, and prepare Adobe Stock packages in one local desktop workspace." />
    <meta property="og:title" content="Thoock | Your stock-image workflow, all together" />
    <meta property="og:description" content="A desktop workspace for stock-image creators. From the first idea to the final package." />
    <meta property="og:type" content="website" />
    <title>Thoock | A desktop workspace for stock-image creators</title>
    <script>
      try { const t = localStorage.getItem('thoock-appearance'); if(t === 'dark' || t === 'light') document.documentElement.dataset.theme = t; } catch {}
    </script>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
